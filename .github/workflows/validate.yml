name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Woechentlich gegen die aktuelle HA-Entwicklung pruefen (Fruehwarnsystem
    # fuer Deprecations wie seinerzeit Mired -> Kelvin).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest (HA-Integrationspruefung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Regressionstests (Dimm-Mathematik)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests/test_brightness.py -q
