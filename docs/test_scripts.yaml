# =====================================================================
#  Light Group Dimmer – Testskripte
#  ---------------------------------------------------------------------
#  Fährt automatisch alle Testfälle durch und schreibt die Ergebnisse
#  maschinenlesbar in /config/dimmer_test_results.txt.
#
#  EINRICHTUNG (einmalig) – zwei Wege:
#
#   EMPFOHLEN (wenn du Packages nutzt, d. h. in configuration.yaml steht
#   "homeassistant: packages: !include_dir_named packages"):
#     -> Diese Datei einfach als packages/lgd_test.yaml speichern. Fertig.
#        notify/template/script werden automatisch dazugemerged, ohne dass
#        du configuration.yaml oder scripts.yaml anfassen musst.
#
#   ALTERNATIV (ohne Packages):
#     1) Die drei Blöcke (notify / template / script) in die passenden
#        Stellen deiner Konfiguration übernehmen. Achtung: Liegt dein
#        script: bereits in einer eigenen Datei (script: !include scripts.yaml),
#        gehören die beiden Skripte OHNE den führenden "script:"-Schlüssel
#        ans Ende von scripts.yaml; notify/template kommen in die
#        configuration.yaml.
#
#   Danach in beiden Fällen:
#   2) HA neu starten (notify/template werden nur beim Neustart aktiv).
#   3) WICHTIG: Delay der Integration auf 5 s stellen (Master-Eintrag),
#      sonst stimmen die Delay-Testfälle (Block 1/2) nicht.
#   4) Gruppe + Mitglieder unten ggf. an deine Testgruppe anpassen.
#
#  AUSFÜHREN:
#   - Entwicklerwerkzeuge -> Aktionen -> script.lgd_test_gewichtet  (~6 min)
#   - danach:              script.lgd_test_delay                    (~1 min)
#   Danach /config/dimmer_test_results.txt öffnen und den Inhalt
#   an Claude geben (oder lokal tests/evaluate_results.py laufen lassen).
#
#  Die Testgruppe/-lampen (an dein Setup anpassbar):
#   Gruppe : light.dimmer_arbeitszimmer
#   L1     : light.hue_play_1
#   L2     : light.hue_play_2
#   L3     : light.arbeitszimmer
#  (Eine evtl. in der Gruppe enthaltene Steckdose wird automatisch
#   ignoriert und stört die 3-Lampen-Auswertung nicht.)
# =====================================================================

notify:
  - name: dimmer_test_log
    platform: file
    filename: dimmer_test_results.txt

template:
  - sensor:
      # Live-Abweichung Gruppenanzeige vs. echter Mittelwert (für die
      # manuelle Beobachtung des Reglers beim Dimmen).
      - name: "LGD Test Abweichung"
        unit_of_measurement: "%"
        state: >
          {% set g = state_attr('light.dimmer_arbeitszimmer','brightness') | float(0) %}
          {% set vals = [state_attr('light.hue_play_1','brightness'),
                         state_attr('light.hue_play_2','brightness'),
                         state_attr('light.arbeitszimmer','brightness')]
                        | select('is_number') | list %}
          {% if vals | length == 0 %}0
          {% else %}{{ ((g - (vals | sum) / (vals | length)) / 2.55) | round(1) }}{% endif %}

script:
  # -------------------------------------------------------------------
  #  Test 1: Gewichtetes Dimmen – 37 Referenzfälle
  # -------------------------------------------------------------------
  lgd_test_gewichtet:
    alias: "LGD Test: Gewichtetes Dimmen (37 Faelle)"
    variables:
      grp: light.dimmer_arbeitszimmer
      l1: light.hue_play_1
      l2: light.hue_play_2
      l3: light.arbeitszimmer
      # Muss GRÖSSER als der konfigurierte Delay sein (damit pro Fall ein
      # frischer Cache aus den gesetzten Werten entsteht):
      wait_settle: 6
      # Zeit, bis die Lampen nach dem Gruppenbefehl gesettelt sind:
      wait_capture: 4
      # Fälle: [L1,L2,L3, Ziel, erwartet L1,L2,L3]  (0 = aus)
      cases:
        - [80, 70, 100, 95, 95, 92, 100]
        - [50, 50, 100, 80, 70, 70, 100]
        - [0, 100, 100, 90, 0, 90, 90]
        - [90, 90, 90, 100, 100, 100, 100]
        - [100, 100, 100, 80, 80, 80, 80]
        - [30, 50, 100, 85, 74, 82, 100]
        - [0, 50, 98, 95, 0, 90, 100]
        - [100, 50, 0, 60, 80, 40, 0]
        - [100, 100, 0, 70, 70, 70, 0]
        - [20, 100, 40, 90, 83, 100, 87]
        - [80, 90, 95, 97, 95, 97, 98]
        - [60, 70, 85, 95, 93, 95, 97]
        - [50, 90, 100, 90, 73, 95, 100]
        - [80, 50, 30, 85, 94, 84, 78]
        - [75, 85, 50, 92, 93, 96, 87]
        - [50, 100, 70, 95, 91, 100, 95]
        - [100, 60, 40, 90, 100, 89, 83]
        - [40, 70, 60, 88, 84, 92, 89]
        - [70, 80, 90, 98, 97, 98, 99]
        - [100, 100, 50, 80, 97, 97, 49]
        - [24, 21, 39, 35, 31, 29, 45]
        - [28, 54, 100, 88, 78, 86, 100]
        - [93, 31, 100, 97, 99, 93, 100]
        - [93, 31, 100, 30, 37, 12, 40]
        - [100, 12, 100, 96, 100, 89, 100]
        - [36, 100, 0, 90, 80, 100, 0]
        - [95, 95, 80, 98, 99, 99, 97]
        - [99, 85, 50, 97, 100, 98, 94]
        - [98, 70, 95, 96, 99, 90, 98]
        - [95, 95, 95, 99, 99, 99, 99]
        - [90, 100, 99, 97, 93, 100, 99]
        - [99, 98, 97, 100, 100, 100, 100]
        - [90, 95, 85, 93, 93, 96, 89]
        - [96, 80, 70, 95, 99, 95, 92]
        - [80, 99, 99, 98, 94, 100, 100]
        - [98, 97, 96, 99, 99, 99, 99]
        - [90, 100, 99, 99, 97, 100, 100]
    sequence:
      - action: notify.dimmer_test_log
        data:
          message: "RUN gewichtet start={{ now() }} delay_hinweis=bitte_5s"
      - repeat:
          for_each: "{{ cases }}"
          sequence:
            # --- Ausgangszustand der 3 Lampen setzen (0 => ausschalten) ---
            - parallel:
                - if: "{{ repeat.item[0] | int > 0 }}"
                  then:
                    - action: light.turn_on
                      target: { entity_id: "{{ l1 }}" }
                      data: { brightness_pct: "{{ repeat.item[0] | int }}" }
                  else:
                    - action: light.turn_off
                      target: { entity_id: "{{ l1 }}" }
                - if: "{{ repeat.item[1] | int > 0 }}"
                  then:
                    - action: light.turn_on
                      target: { entity_id: "{{ l2 }}" }
                      data: { brightness_pct: "{{ repeat.item[1] | int }}" }
                  else:
                    - action: light.turn_off
                      target: { entity_id: "{{ l2 }}" }
                - if: "{{ repeat.item[2] | int > 0 }}"
                  then:
                    - action: light.turn_on
                      target: { entity_id: "{{ l3 }}" }
                      data: { brightness_pct: "{{ repeat.item[2] | int }}" }
                  else:
                    - action: light.turn_off
                      target: { entity_id: "{{ l3 }}" }
            # --- Warten: Lampen settlen + evtl. alter Cache läuft ab ---
            - delay: { seconds: "{{ wait_settle | int }}" }
            # --- Der eigentliche Test: Gruppe auf Zielhelligkeit ---
            - action: light.turn_on
              target: { entity_id: "{{ grp }}" }
              data: { brightness_pct: "{{ repeat.item[3] | int }}" }
            - delay: { seconds: "{{ wait_capture | int }}" }
            # --- Ergebnis maschinenlesbar loggen ---
            - action: notify.dimmer_test_log
              data:
                message: >-
                  TF{{ '%02d' % repeat.index }}
                  start={{ repeat.item[0] }}/{{ repeat.item[1] }}/{{ repeat.item[2] }}
                  ziel={{ repeat.item[3] }}
                  soll={{ repeat.item[4] }}/{{ repeat.item[5] }}/{{ repeat.item[6] }}
                  ist={{ (state_attr(l1,'brightness')|float(0)/2.55)|round|int if is_state(l1,'on') and state_attr(l1,'brightness') is not none else 0 }}/{{ (state_attr(l2,'brightness')|float(0)/2.55)|round|int if is_state(l2,'on') and state_attr(l2,'brightness') is not none else 0 }}/{{ (state_attr(l3,'brightness')|float(0)/2.55)|round|int if is_state(l3,'on') and state_attr(l3,'brightness') is not none else 0 }}
                  gruppe={{ (state_attr(grp,'brightness')|float(0)/2.55)|round|int if is_state(grp,'on') and state_attr(grp,'brightness') is not none else 0 }}
      - action: notify.dimmer_test_log
        data:
          message: "END gewichtet"

  # -------------------------------------------------------------------
  #  Test 2: Delay-/Cache-Verhalten (Block 1 != Block 2)
  #  Voraussetzung: Delay = 5 s
  # -------------------------------------------------------------------
  lgd_test_delay:
    alias: "LGD Test: Delay-Verhalten (Cache)"
    variables:
      grp: light.dimmer_arbeitszimmer
      l1: light.hue_play_1
      l2: light.hue_play_2
      l3: light.arbeitszimmer
    sequence:
      - action: notify.dimmer_test_log
        data:
          message: "RUN delay start={{ now() }}"

      # ---------- Block 2: kurze Wartezeit (3s < 5s) => Cache lebt ----------
      # Erwartung: zurück zur Original-Verteilung ~37/72/89
      - parallel:
          - { action: light.turn_on, target: { entity_id: "{{ l1 }}" }, data: { brightness_pct: 37 } }
          - { action: light.turn_on, target: { entity_id: "{{ l2 }}" }, data: { brightness_pct: 72 } }
          - { action: light.turn_on, target: { entity_id: "{{ l3 }}" }, data: { brightness_pct: 89 } }
      - delay: { seconds: 8 }   # alter Cache sicher tot, Lampen gesettelt
      - action: light.turn_on
        target: { entity_id: "{{ grp }}" }
        data: { brightness_pct: 99 }
      - delay: { seconds: 3 }   # < Delay(5) => Cache lebt noch
      - action: light.turn_on
        target: { entity_id: "{{ grp }}" }
        data: { brightness_pct: 66 }
      - delay: { seconds: 4 }
      - action: notify.dimmer_test_log
        data:
          message: >-
            BLOCK2 wartezeit=3s erwartet=37/72/89
            ist={{ (state_attr(l1,'brightness')|float(0)/2.55)|round|int if is_state(l1,'on') else 0 }}/{{ (state_attr(l2,'brightness')|float(0)/2.55)|round|int if is_state(l2,'on') else 0 }}/{{ (state_attr(l3,'brightness')|float(0)/2.55)|round|int if is_state(l3,'on') else 0 }}

      # ---------- Block 1: lange Wartezeit (5.8s > 5s) => Cache tot ----------
      # Erwartung: aus dem 99%-Zustand heraus ~65/66/67
      - parallel:
          - { action: light.turn_on, target: { entity_id: "{{ l1 }}" }, data: { brightness_pct: 37 } }
          - { action: light.turn_on, target: { entity_id: "{{ l2 }}" }, data: { brightness_pct: 72 } }
          - { action: light.turn_on, target: { entity_id: "{{ l3 }}" }, data: { brightness_pct: 89 } }
      - delay: { seconds: 8 }
      - action: light.turn_on
        target: { entity_id: "{{ grp }}" }
        data: { brightness_pct: 99 }
      - delay: { seconds: 5, milliseconds: 800 }   # > Delay(5) => Cache tot
      - action: light.turn_on
        target: { entity_id: "{{ grp }}" }
        data: { brightness_pct: 66 }
      - delay: { seconds: 4 }
      - action: notify.dimmer_test_log
        data:
          message: >-
            BLOCK1 wartezeit=5.8s erwartet=65/66/67
            ist={{ (state_attr(l1,'brightness')|float(0)/2.55)|round|int if is_state(l1,'on') else 0 }}/{{ (state_attr(l2,'brightness')|float(0)/2.55)|round|int if is_state(l2,'on') else 0 }}/{{ (state_attr(l3,'brightness')|float(0)/2.55)|round|int if is_state(l3,'on') else 0 }}
      - action: notify.dimmer_test_log
        data:
          message: "END delay"
